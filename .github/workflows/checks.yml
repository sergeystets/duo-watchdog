# Everything a release must pass, run for every pull request and push (ci.yml) and before every release
# (release.yml), which publishes the very files these jobs built.
name: Checks

on:
  workflow_call:

permissions:
  contents: read

env:
  # The IntelliJ IDEA the plugin is compiled against; the Plugin Verifier then checks it on the oldest one it
  # installs on and the newest (intellij/build.gradle.kts).
  IDEA_VERSION: 2025.3.1

jobs:
  core:
    name: Plugin core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, and the UI painted headless
        run: ./gradlew :intellij:core:test
      - name: Keep the painted UI
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-previews
          path: intellij/core/build/ui-previews/
          if-no-files-found: ignore

  plugin:
    name: IntelliJ plugin, built and verified
    runs-on: ubuntu-latest
    steps:
      - name: Room for three IDEs
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the plugin against IntelliJ IDEA ${{ env.IDEA_VERSION }}
        run: ./gradlew :intellij:buildPlugin -PideaVersion=$IDEA_VERSION
      - name: The zip is the plugin, all in its duo-watchdog folder
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' intellij/build.gradle.kts)
          zip=intellij/build/distributions/duo-watchdog-$version.zip
          listing=$(unzip -l "$zip")
          echo "$listing"
          grep -q " duo-watchdog/lib/duo-watchdog-$version.jar$" <<<"$listing"
          outside=$(awk 'NR > 3 && $4 != "" && $4 !~ /^duo-watchdog\// && $4 !~ /^-+$/ { print $4 }' <<<"$listing")
          if [ -n "$outside" ]; then echo "Outside the duo-watchdog folder: $outside"; exit 1; fi
      - name: Plugin Verifier, on the oldest and the newest IntelliJ IDEA
        run: ./gradlew :intellij:verifyPlugin -PideaVersion=$IDEA_VERSION
      - name: Keep the Verifier's reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: intellij/build/reports/pluginVerifier/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: intellij/build/distributions/duo-watchdog-*.zip
          if-no-files-found: error

  vscode:
    name: VS Code extension, tested in VS Code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Package the .vsix
        run: npm run package
      - name: The .vsix in VS Code, the oldest it supports and the current stable
        run: xvfb-run -a npm run smoke
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: vscode/duo-watchdog-*.vsix
          if-no-files-found: error

  installers:
    name: Installer on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: install.sh installs the latest release into stand-in editors
        if: runner.os != 'Windows'
        run: bash .github/scripts/install-smoke.sh
      - name: install.ps1 installs the latest release into stand-in editors (Windows PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/install-smoke.ps1
